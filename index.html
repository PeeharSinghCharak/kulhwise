    // Helper: SHA-256 for browser fallback
    async function sha256Browser(str) {
      const buffer = new TextEncoder().encode(str);
      const hash = await crypto.subtle.digest('SHA-256', buffer);
      return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

              </div>
            </div>

            {/* TWO-COLUMN WORKBENCH: PLOT INSPECTOR + FARMER BOT SIMULATOR */}
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">

              {/* 3.3 SELECTED PLOT INSPECTOR (Left Column - 7 Cols) */}
              <div className="lg:col-span-7 bg-slate-900/90 p-5 rounded-2xl border border-slate-800 shadow-xl space-y-4">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <div>
                    <span className="text-[10px] uppercase tracking-wider text-cyan-400 font-bold">Selected Plot Inspector</span>
                    <h3 className="text-lg font-black text-white flex items-center gap-2">
                      <span>Plot #{selectedPlot?.plot_id}</span>
                      <span className="text-slate-400 font-normal">— {selectedPlot?.farmer_name}</span>
                    </h3>
                  </div>
                  {selectedPlot && (
                    <div className="text-right">
                      <span className={`px-2.5 py-1 rounded-md text-xs font-bold border ${getStatusBadge(selectedPlot.status).bg}`}>
                        {selectedPlot.status}
                      </span>
                    </div>
                  )}
                </div>

                {selectedPlot && (
                  <div className="space-y-4">
                    {/* Plot Meta Grid */}
                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 text-xs">
                      <div className="p-3 bg-slate-950/70 rounded-xl border border-slate-800">
                        <span className="text-slate-400 block text-[10px] uppercase font-semibold">Reach & Distance</span>
                        <strong className="text-white text-sm">{selectedPlot.reach} Reach</strong>
                        <div className="text-slate-400 text-[11px] font-mono">{selectedPlot.distance_km} km from intake</div>
                      </div>

                      <div className="p-3 bg-slate-950/70 rounded-xl border border-slate-800">
                        <span className="text-slate-400 block text-[10px] uppercase font-semibold">Land Area</span>
                        <strong className="text-white text-sm">{selectedPlot.area_kanals} Kanals</strong>
                        <div className="text-slate-400 text-[11px] font-mono">~{(selectedPlot.area_kanals / 8.0).toFixed(1)} Acres</div>
                      </div>

                      <div className="p-3 bg-slate-950/70 rounded-xl border border-slate-800">
                        <span className="text-slate-400 block text-[10px] uppercase font-semibold">Crop & Water Duty</span>
                        <strong className="text-white text-sm">{selectedPlot.crop}</strong>
                        <div className="text-cyan-300 text-[11px] font-mono">K_crop = {selectedPlot.crop_factor}</div>
                      </div>

                      <div className="p-3 bg-slate-950/70 rounded-xl border border-slate-800">
                        <span className="text-slate-400 block text-[10px] uppercase font-semibold">Est. Seepage Loss</span>
                        <strong className="text-amber-400 text-sm font-mono">{selectedPlot.estimated_seepage_loss}%</strong>
                        <div className="text-slate-400 text-[11px]">Unlined channel</div>
                      </div>
                    </div>

                    {/* Turn Breakdown & Satisfaction */}
                    <div className="p-4 bg-slate-950/90 rounded-xl border border-slate-800 space-y-3">
                      <div className="flex justify-between items-center text-xs border-b border-slate-800 pb-2">
                        <span className="font-bold text-slate-300 uppercase tracking-wider">Multi-Factor Turn Calculation</span>
                        <span className="text-cyan-400 font-mono text-[11px]">Formula: Tᵢ = [Base × Seepage] + (β × Debt) − Penalty</span>
                      </div>

                      <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 text-center text-xs">
                        <div className="p-2 rounded bg-slate-900 border border-slate-800">
                          <span className="text-slate-400 text-[10px] block">Base Duration</span>
                          <strong className="text-white font-mono text-sm">{selectedPlot.base_minutes}m</strong>
                        </div>
                        <div className="p-2 rounded bg-slate-900 border border-slate-800">
                          <span className="text-slate-400 text-[10px] block">Carried Debt</span>
                          <strong className="text-amber-400 font-mono text-sm">+{selectedPlot.water_debt}m</strong>
                        </div>
                        <div className="p-2 rounded bg-slate-900 border border-slate-800">
                          <span className="text-slate-400 text-[10px] block">Overdraw Penalty</span>
                          <strong className="text-rose-400 font-mono text-sm">-{selectedPlot.overdraw_adjustment}m</strong>
                        </div>
                        <div className="p-2 rounded bg-cyan-950/80 border border-cyan-800">
                          <span className="text-cyan-300 text-[10px] block font-semibold">Scheduled Turn</span>
                          <strong className="text-cyan-200 font-mono text-base">{selectedPlot.scheduled_minutes}m</strong>
                        </div>
                      </div>

                      <div className="flex items-center justify-between text-xs pt-1">
                        <span className="text-slate-400">
                          Effective Delivered Water (Model Est): <strong className="text-white font-mono">{selectedPlot.delivered_minutes} min</strong>
                        </span>
                        <span className="text-slate-400">
                          Crop Satisfaction (xᵢ): <strong className="text-emerald-400 font-mono">{selectedPlot.satisfaction_ratio}</strong>
                        </span>
                      </div>
                    </div>

                    {/* Plain Language Explanation */}
                    <div className="p-3.5 rounded-xl bg-slate-950 border border-slate-800 text-xs">
                      <span className="text-[10px] uppercase font-bold text-slate-400 tracking-wider block mb-1">Schedule Explanation</span>
                      <p className="text-slate-200 leading-relaxed">
                        {selectedPlot.explanation || "Regular allocation calculated based on plot area and crop duty."}
                      </p>
                    </div>

                    {/* Hardware light disclaimer */}
                    <p className="text-[11px] text-slate-400 italic">
                      *Note: Minutes are allocated canal flow time, not measured litres. Without automated flumes or flow meters, effective water volume is an engineering model estimate.
                    </p>
                  </div>
                )}
              </div>

              {/* 3.5 FARMER REPORT SIMULATOR & ACTIVITY FEED (Right Column - 5 Cols) */}
              <div className="lg:col-span-5 space-y-6">

                {/* Farmer Report Simulator Card */}
                <div className="bg-slate-900/90 p-5 rounded-2xl border border-slate-800 shadow-xl space-y-4">
                  <div className="border-b border-slate-800 pb-2">
                    <span className="text-[10px] uppercase tracking-wider text-emerald-400 font-bold">Farmer Flow Simulator</span>
                    <h3 className="text-base font-bold text-white flex items-center gap-2">
                      <span>📱</span> Bot Report Simulator (WhatsApp/IVR)
                    </h3>
                    <p className="text-xs text-slate-400">
                      Simulate a farmer reporting turn delivery. System executes spatial neighbour consensus.
                    </p>
                  </div>

                  <div className="space-y-3">
                    <div className="space-y-1">
                      <label className="text-xs font-semibold text-slate-300">Select Plot to Report:</label>
                      <select
                        value={botPlotId}
                        onChange={(e) => setBotPlotId(Number(e.target.value))}
                        className="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-xs text-slate-100 focus:outline-none focus:border-cyan-500 font-mono"
                      >
                        {plots.map((p) => (
                          <option key={p.plot_id} value={p.plot_id}>
                            Plot #{p.plot_id}: {p.farmer_name} ({p.reach} Reach, {p.crop})
                          </option>
                        ))}
                      </select>
                    </div>

                    {/* Two Clear Actions */}
                    <div className="grid grid-cols-2 gap-2 pt-1">
                      <button
                        onClick={() => handleSubmitBotReport(botPlotId, "FULL")}
                        disabled={isLoading}
                        className="py-2.5 px-3 bg-emerald-950 hover:bg-emerald-900 border border-emerald-600/70 text-emerald-200 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 active:scale-95 transition"
                      >
                        <span>✓</span> Got Full Water
                      </button>

                      <button
                        onClick={() => handleSubmitBotReport(botPlotId, "LOW_OR_NO")}
                        disabled={isLoading}
                        className="py-2.5 px-3 bg-rose-950 hover:bg-rose-900 border border-rose-600/70 text-rose-200 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 active:scale-95 transition"
                      >
                        <span>▼</span> Low / No Water
                      </button>
                    </div>

                    {/* Reproducible Demo Quick Tests */}
                    <div className="p-3 bg-slate-950/80 rounded-xl border border-slate-800 space-y-2">
                      <span className="text-[10px] uppercase font-bold text-slate-400 tracking-wider block">Demo Presets:</span>
                      <div className="flex flex-col gap-1.5">
                        <button
                          onClick={() => {
                            setBotPlotId(14);
                            handleSubmitBotReport(14, "LOW_OR_NO");
                          }}
                          className="text-left px-2.5 py-1.5 rounded-lg bg-amber-950/60 hover:bg-amber-900/60 text-amber-300 border border-amber-800/60 text-xs font-medium transition"
                        >
                          🧪 <strong>Test Contradiction (Plot #14):</strong> Reports Low, while #13 & #15 reported Full → Triggers Anomaly Flag!
                        </button>

                        <button
                          onClick={() => {
                            setBotPlotId(24);
                            handleSubmitBotReport(24, "LOW_OR_NO");
                          }}
                          className="text-left px-2.5 py-1.5 rounded-lg bg-cyan-950/60 hover:bg-cyan-900/60 text-cyan-300 border border-cyan-800/60 text-xs font-medium transition"
                        >
                          🧪 <strong>Test Contiguous Shortage (Tail #24):</strong> Adjacent tail plots corroborating canal dryout → Wipes doubt, credits debt!
                        </button>
                      </div>
                    </div>

                    {/* Bot Consensus Feedback */}
                    {botResult && (
                      <div className={`p-3 rounded-xl border text-xs ${
                        botResult.is_anomaly ? "bg-amber-950 border-amber-500/80 text-amber-200" : "bg-slate-950 border-slate-800 text-slate-300"
                      }`}>
                        <div className="font-bold flex items-center gap-1.5 mb-1">
                          <span>{botResult.is_anomaly ? "⚠ Anomaly Flagged" : "✓ Spatial Consensus Verified"}</span>
                          <span className="text-[10px] uppercase px-1.5 py-0.5 rounded bg-slate-900 font-mono">
                            {botResult.review_status}
                          </span>
                        </div>
                        <p className="leading-snug text-[11px]">{botResult.explanation}</p>
                      </div>
                    )}
                  </div>
                </div>

                {/* 3.6 ACTIVITY FEED & ALERTS */}
                <div className="bg-slate-900/90 p-5 rounded-2xl border border-slate-800 shadow-xl space-y-3">
                  <div className="flex items-center justify-between border-b border-slate-800 pb-2">
                    <h3 className="text-base font-bold text-white flex items-center gap-2">
                      <span>🔔</span> Real-Time Activity Feed
                    </h3>
                    <span className="text-[10px] text-slate-400 font-mono">Auto-Updating</span>
                  </div>

                  <div className="max-h-60 overflow-y-auto space-y-2 pr-1">
                    {(systemState.activity_feed || []).map((act, i) => (
                      <div key={i} className="p-2.5 rounded-xl bg-slate-950 border border-slate-800/80 text-xs space-y-1">
                        <div className="flex items-center justify-between text-[10px]">
                          <span className="font-mono text-slate-400">{act.timestamp}</span>
                          <span className={`px-1.5 py-0.5 rounded font-mono font-bold ${
                            act.status === "ALERT" ? "bg-amber-900 text-amber-200" :
                            act.status === "WARNING" ? "bg-rose-900 text-rose-200" :
                            act.status === "ERROR" ? "bg-red-950 text-red-200 border border-red-700" :
                            "bg-slate-800 text-emerald-300"
                          }`}>
                            {act.event_type}
                          </span>
                        </div>
                        <p className="text-slate-300 leading-snug">{act.explanation}</p>
                      </div>
                    ))}
                  </div>
                </div>

              </div>
            </div>

            {/* 3.7: TAMPER-EVIDENT AUDIT LEDGER */}
            <div className="bg-slate-900/90 p-5 rounded-2xl border border-slate-800 shadow-xl space-y-4">
              <div className="flex flex-wrap items-center justify-between gap-4">
                <div>
                  <div className="flex items-center gap-2">
                    <span className="text-base">🛡️</span>
                    <h2 className="text-base font-bold text-white">Cryptographic Tamper-Evident Audit Ledger</h2>
                    <span className="text-[11px] px-2 py-0.5 rounded-full bg-slate-800 text-slate-400 border border-slate-700 font-mono">
                      SHA-256 Chained Blocks
                    </span>
                  </div>
                  <p className="text-xs text-slate-400">
                    Chronological immutable water distribution turns. Demonstrates tamper detection if records are retrospectively changed.
                  </p>
                </div>

                {/* Ledger Demo Controls */}
                <div className="flex items-center gap-2">
                  <button
                    onClick={handleTamperTest}
                    className="px-3.5 py-2 rounded-xl bg-rose-950/80 hover:bg-rose-900 text-rose-300 border border-rose-700/60 text-xs font-bold transition active:scale-95 flex items-center gap-1.5"
                  >
                    <span>🚨</span> Simulate Tampering (Block #5)
                  </button>

                  <button
                    onClick={handleRepairLedger}
                    className="px-3.5 py-2 rounded-xl bg-emerald-950/80 hover:bg-emerald-900 text-emerald-300 border border-emerald-700/60 text-xs font-bold transition active:scale-95 flex items-center gap-1.5"
                  >
                    <span>🛡️</span> Restore Verified State
                  </button>
                </div>
              </div>

              {/* Status Alert Banner */}
              <div className={`p-3.5 rounded-xl border text-xs flex items-center justify-between ${
                metrics.ledger_intact ? "bg-emerald-950/40 border-emerald-600/50 text-emerald-300" : "bg-rose-950 border-rose-500 text-rose-200 animate-pulse"
              }`}>
                <div className="flex items-center gap-2">
                  <span className="text-lg">{metrics.ledger_intact ? "✓" : "🚨"}</span>
                  <div>
                    <strong>{metrics.ledger_intact ? "Cryptographic Ledger Verified" : "CRITICAL ALERT: Tampering Detected!"}</strong>
                    <p className="text-[11px] text-slate-300">
                      {systemState.ledger_status?.message || "All SHA-256 hash chains intact."}
                    </p>
                  </div>
                </div>
                <span className="text-xs font-mono font-bold px-2 py-1 rounded bg-slate-900">
                  {metrics.ledger_intact ? "STATUS: VALID" : `BROKEN: BLOCK #${metrics.ledger_broken_at || 5}`}
                </span>
              </div>

              {/* Ledger Table */}
              <div className="max-h-72 overflow-y-auto border border-slate-800 rounded-xl">
                <table className="w-full text-left text-xs font-mono">
                  <thead className="bg-slate-950 text-slate-400 sticky top-0 border-b border-slate-800 text-[11px]">
                    <tr>
                      <th className="py-2.5 px-3">Block #</th>
                      <th className="py-2.5 px-3">Timestamp</th>
                      <th className="py-2.5 px-3">Plot / Farmer</th>
                      <th className="py-2.5 px-3">Allocated (m)</th>
                      <th className="py-2.5 px-3">Delivered (m)</th>
                      <th className="py-2.5 px-3">Event Type</th>
                      <th className="py-2.5 px-3">Current SHA-256 Hash</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-800/60 text-slate-300">
                    {ledgerBlocks.map((block) => {
                      const isBroken = !metrics.ledger_intact && block.block_index === (metrics.ledger_broken_at || 5);
                      return (
                        <tr key={block.id || block.block_index} className={isBroken ? "bg-rose-950/80 text-rose-200 font-bold" : "hover:bg-slate-800/40"}>
                          <td className="py-2 px-3 font-bold text-white">#{block.block_index}</td>
                          <td className="py-2 px-3 text-slate-400 text-[11px]">{block.timestamp}</td>
                          <td className="py-2 px-3 text-slate-200 font-sans">{block.farmer_name} (Plot #{block.plot_id})</td>
                          <td className="py-2 px-3 text-cyan-300">{block.allocated_minutes}m</td>
                          <td className="py-2 px-3 text-emerald-300">{block.reported_minutes}m</td>
                          <td className="py-2 px-3">
                            <span className="px-1.5 py-0.5 rounded text-[10px] bg-slate-800 font-sans">
                              {block.event_type}
                            </span>
                          </td>
                          <td className="py-2 px-3 text-[10px] text-slate-400 truncate max-w-xs" title={block.current_hash}>
                            {block.current_hash ? block.current_hash.slice(0, 16) + "..." : "---"}
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>

              {/* Educational Disclaimer */}
              <div className="p-3 bg-slate-950/80 rounded-xl border border-slate-800/80 text-[11px] text-slate-400 leading-relaxed">
                💡 <strong>Audit Ledger Transparency Notice:</strong> A cryptographic SHA-256 hash chain mathematically guarantees that records have not been altered or tampered with in storage after creation. It does not certify the physical veracity of the farmer's original claim at the time of entry, and is not a distributed blockchain.
              </div>
            </div>

          </main>

          {/* FOOTER */}
          <footer className="max-w-7xl mx-auto px-4 mt-8 pt-6 border-t border-slate-900 text-center text-xs text-slate-400 space-y-1">
            <p><strong>KulhWise (Digital Kohli)</strong> — Smart Canal Water Rotation & Accountability Prototype</p>
            <p className="text-[11px]">Hardware-Light Software-First Irrigation Solution for Himalayan & Warabandi Canal Communities</p>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
