<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KulhWise – Smart Water Rotation for Farmers</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @keyframes pulse-slow {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .animate-pulse-slow {
      animation: pulse-slow 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function OverviewPanel({ stats, onRunAlgorithm, onReset, isRunning }) {
      const fairnessScore = stats?.current_fairness_score ?? 29.5;
      const initialScore = stats?.initial_fairness_score ?? 29.5;
      const isOptimized = fairnessScore > 75;

      const getScoreColor = (score) => {
        if (score >= 80) return { ring: '#10b981', bg: 'bg-emerald-50 text-emerald-700 border-emerald-200', text: 'Fair & Balanced' };
        if (score >= 50) return { ring: '#f59e0b', bg: 'bg-amber-50 text-amber-700 border-amber-200', text: 'Moderate Disparity' };
        return { ring: '#f43f5e', bg: 'bg-rose-50 text-rose-700 border-rose-200', text: 'Severe Tail Deprivation' };
      };

      const scoreMeta = getScoreColor(fairnessScore);
      const radius = 42;
      const circumference = 2 * Math.PI * radius;
      const strokeDashoffset = circumference - (fairnessScore / 100) * circumference;

      return (
        <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 mb-8">
          <div className="flex flex-col lg:flex-row items-center justify-between gap-6">
            
            {/* Left: Fairness Score Gauge */}
            <div className="flex items-center gap-6">
              <div className="relative w-28 h-28 flex items-center justify-center">
                <svg className="w-full h-full transform -rotate-90">
                  <circle
                    cx="56"
                    cy="56"
                    r={radius}
                    stroke="#e2e8f0"
                    strokeWidth="8"
                    fill="transparent"
                  />
                  <circle
                    cx="56"
                    cy="56"
                    r={radius}
                    stroke={scoreMeta.ring}
                    strokeWidth="8"
                    strokeDasharray={circumference}
                    strokeDashoffset={strokeDashoffset}
                    strokeLinecap="round"
                    style={{ transition: 'stroke-dashoffset 1s ease-out' }}
                    fill="transparent"
                  />
                </svg>
                <div className="absolute flex flex-col items-center">
                  <span className="text-2xl font-bold tracking-tight text-slate-800">
                    {fairnessScore}%
                  </span>
                  <span className="text-[10px] font-medium uppercase tracking-wider text-slate-400">
                    Jain's Index
                  </span>
                </div>
              </div>

              <div>
                <div className="flex items-center gap-2 mb-1">
                  <h3 className="text-lg font-bold text-slate-900">System Fairness Score</h3>
                  <span className={`px-2.5 py-0.5 text-xs font-semibold rounded-full border ${scoreMeta.bg}`}>
                    {scoreMeta.text}
                  </span>
                </div>
                <p className="text-sm text-slate-500 max-w-md">
                  {isOptimized 
                    ? "KulhWise rotation algorithm is active! Water deficits at tail canal are compensated."
                    : "Initial village baseline: Head-reach farmers have captured water while tail-end farmers are starving."}
                </p>
                <div className="flex items-center gap-3 mt-2 text-xs text-slate-500">
                  <span>Baseline: <strong>{initialScore}%</strong></span>
                  <span>•</span>
                  <span className={isOptimized ? "text-emerald-600 font-bold" : ""}>
                    Status: {isOptimized ? `+${(fairnessScore - initialScore).toFixed(1)}% Improvement` : "Requires Optimization"}
                  </span>
                </div>
              </div>
            </div>

            {/* Middle: Metric Cards */}
            <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 w-full lg:w-auto">
              <div className="bg-slate-50 p-3 rounded-xl border border-slate-100 text-center">
                <div className="text-xs font-medium text-slate-400 uppercase">Total Farmers</div>
                <div className="text-xl font-bold text-slate-800 mt-0.5">{stats?.total_farmers ?? 30}</div>
                <div className="text-[11px] text-slate-500">Upper / Mid / Tail</div>
              </div>

              <div className="bg-slate-50 p-3 rounded-xl border border-slate-100 text-center">
                <div className="text-xs font-medium text-slate-400 uppercase">Distributed</div>
                <div className="text-xl font-bold text-sky-600 mt-0.5">{stats?.total_received_hours ?? 0} hrs</div>
                <div className="text-[11px] text-slate-500">Canal flow hours</div>
              </div>

              <div className="bg-slate-50 p-3 rounded-xl border border-slate-100 text-center">
                <div className="text-xs font-medium text-slate-400 uppercase">Tail Deficit</div>
                <div className="text-xl font-bold text-rose-600 mt-0.5">{stats?.tail_deficit_hours ?? 0} hrs</div>
                <div className="text-[11px] text-rose-400">Starved tail fields</div>
              </div>

              <div className="bg-slate-50 p-3 rounded-xl border border-slate-100 text-center">
                <div className="text-xs font-medium text-slate-400 uppercase">Ledger Status</div>
                <div className="text-xl font-bold text-emerald-600 mt-0.5">SHA-256</div>
                <div className="text-[11px] text-emerald-600 font-medium">✓ Cryptographic</div>
              </div>
            </div>

            {/* Right: Demo Action Buttons */}
            <div className="flex flex-col sm:flex-row lg:flex-col gap-2.5 w-full lg:w-auto">
              <button
                onClick={onRunAlgorithm}
                disabled={isRunning}
                className={`w-full px-5 py-3 rounded-xl font-semibold text-white shadow-md transition-all flex items-center justify-center gap-2 text-sm ${
                  isRunning 
                    ? 'bg-emerald-400 cursor-not-allowed' 
                    : 'bg-emerald-600 hover:bg-emerald-700 active:scale-95 shadow-emerald-200'
                }`}
              >
                {isRunning ? (
                  <>
                    <svg className="animate-spin h-4 w-4 text-white" viewBox="0 0 24 24" fill="none">
                      <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                      <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
                    </svg>
                    <span>Optimizing Schedule...</span>
                  </>
                ) : (
                  <>
                    <span>⚡ Run KulhWise Algorithm</span>
                  </>
                )}
              </button>

              <button
                onClick={onReset}
                className="w-full px-4 py-2 rounded-xl text-xs font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 active:scale-95 transition-all text-center"
              >
                ↺ Reset to Unfair Baseline
              </button>
            </div>

          </div>
        </div>
      );
    }

    function ScheduleTimeline({ schedule, onQuickConfirm }) {
      const [filterReach, setFilterReach] = useState('ALL');

      const filteredSchedule = (schedule || []).filter(slot => {
        if (filterReach === 'ALL') return true;
        return slot.canal_reach.toUpperCase() === filterReach;
      });

      const getReachBadge = (reach) => {
        switch (reach.toLowerCase()) {
          case 'tail': return 'bg-purple-100 text-purple-700 border-purple-200';
          case 'middle': return 'bg-amber-100 text-amber-700 border-amber-200';
          case 'head': return 'bg-emerald-100 text-emerald-700 border-emerald-200';
          default: return 'bg-slate-100 text-slate-700 border-slate-200';
        }
      };

      const getStatusBadge = (status) => {
        switch (status) {
          case 'FULL': return 'bg-emerald-100 text-emerald-800 border-emerald-200';
          case 'PARTIAL': return 'bg-amber-100 text-amber-800 border-amber-200';
          case 'MISSED': return 'bg-rose-100 text-rose-800 border-rose-200';
          default: return 'bg-sky-50 text-sky-700 border-sky-200';
        }
      };

      if (!schedule || schedule.length === 0) {
        return (
          <div className="bg-white rounded-2xl p-10 text-center border border-slate-200 shadow-sm">
            <div className="w-16 h-16 bg-sky-50 text-sky-500 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
              💧
            </div>
            <h4 className="text-lg font-bold text-slate-800 mb-1">No Active Rotation Schedule</h4>
            <p className="text-sm text-slate-500 max-w-md mx-auto mb-5">
              Click the <strong>"Run KulhWise Algorithm"</strong> button above to calculate fair time slots based on plot sizes and accumulated farmer deficits.
            </p>
          </div>
        );
      }

      return (
        <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
          <div className="p-5 border-b border-slate-100 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
            <div>
              <div className="flex items-center gap-2">
                <h3 className="text-lg font-bold text-slate-900">Today's Kulh Rotation Schedule</h3>
                <span className="bg-sky-100 text-sky-700 text-xs px-2.5 py-0.5 rounded-full font-semibold">
                  {schedule.length} Rotation Slots
                </span>
              </div>
              <p className="text-xs text-slate-500 mt-0.5">
                Fair rotation prioritized by accumulated deficit hours & crop water duty
              </p>
            </div>

            <div className="flex items-center gap-1.5 bg-slate-100 p-1 rounded-xl text-xs font-medium">
              {['ALL', 'TAIL', 'MIDDLE', 'HEAD'].map((reach) => (
                <button
                  key={reach}
                  onClick={() => setFilterReach(reach)}
                  className={`px-3 py-1.5 rounded-lg transition-all ${
                    filterReach === reach
                      ? 'bg-white text-slate-800 shadow-sm font-semibold'
                      : 'text-slate-500 hover:text-slate-700'
                  }`}
                >
                  {reach === 'ALL' ? 'All Sections' : `${reach} Reach`}
                </button>
              ))}
            </div>
          </div>

          <div className="overflow-x-auto">
            <table className="w-full text-left border-collapse">
              <thead>
                <tr className="bg-slate-50/75 border-b border-slate-100 text-[11px] font-semibold text-slate-500 uppercase tracking-wider">
                  <th className="py-3 px-4">Rank</th>
                  <th className="py-3 px-4">Time Slot</th>
                  <th className="py-3 px-4">Farmer Details</th>
                  <th className="py-3 px-4">Canal Reach</th>
                  <th className="py-3 px-4">Crop & Acres</th>
                  <th className="py-3 px-4">Allocated Flow</th>
                  <th className="py-3 px-4">Priority Score</th>
                  <th className="py-3 px-4">Status</th>
                  <th className="py-3 px-4 text-right">Action</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-100 text-sm text-slate-700">
                {filteredSchedule.map((slot) => (
                  <tr key={slot.id || slot.farmer_id} className="hover:bg-slate-50/80 transition-colors">
                    <td className="py-3.5 px-4 font-semibold">
                      <span className={`inline-flex items-center justify-center w-6 h-6 rounded-full text-xs font-bold ${
                        slot.priority_rank <= 5 
                          ? 'bg-purple-600 text-white shadow-sm' 
                          : 'bg-slate-100 text-slate-600'
                      }`}>
                        #{slot.priority_rank}
                      </span>
                    </td>

                    <td className="py-3.5 px-4 font-medium text-slate-900 whitespace-nowrap">
                      <div className="flex items-center gap-1.5">
                        <span className="text-sky-600">⏱</span>
                        <span>{slot.start_time} – {slot.end_time}</span>
                      </div>
                    </td>

                    <td className="py-3.5 px-4">
                      <div className="font-semibold text-slate-900">{slot.farmer_name}</div>
                      <div className="text-xs text-slate-400">Farmer ID: #{slot.farmer_id}</div>
                    </td>

                    <td className="py-3.5 px-4">
                      <span className={`px-2.5 py-1 text-xs font-semibold rounded-full border ${getReachBadge(slot.canal_reach)}`}>
                        {slot.canal_reach} Reach
                      </span>
                    </td>

                    <td className="py-3.5 px-4">
                      <div className="text-xs font-medium text-slate-800">{slot.crop_type}</div>
                      <div className="text-[11px] text-slate-400">{slot.plot_acres} Acres</div>
                    </td>

                    <td className="py-3.5 px-4">
                      <div className="font-bold text-sky-700">{slot.allocated_hours} hrs</div>
                      {slot.compensation_applied > 0 && (
                        <div className="text-[10px] text-purple-600 font-semibold bg-purple-50 px-1.5 py-0.5 rounded inline-block mt-0.5 border border-purple-100">
                          +{slot.compensation_applied}h Deficit Relief
                        </div>
                      )}
                    </td>

                    <td className="py-3.5 px-4 font-mono text-xs font-semibold text-slate-600">
                      {slot.priority_score}
                    </td>

                    <td className="py-3.5 px-4">
                      <span className={`px-2.5 py-1 text-xs font-semibold rounded-full border ${getStatusBadge(slot.status)}`}>
                        {slot.status}
                      </span>
                    </td>

                    <td className="py-3.5 px-4 text-right">
                      <button
                        onClick={() => onQuickConfirm(slot.farmer_id)}
                        className="px-3 py-1 text-xs font-medium bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg transition-all"
                      >
                        Simulate
                      </button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    function FarmerSimulation({ farmers, selectedFarmerId, onSelectFarmer, onConfirmTurn, isSubmitting }) {
      const [selectedId, setSelectedId] = useState(selectedFarmerId || (farmers[0]?.id ?? ''));
      const [status, setStatus] = useState('FULL');
      const [partialHours, setPartialHours] = useState(1.5);
      const [notes, setNotes] = useState('');

      useEffect(() => {
        if (selectedFarmerId) {
          setSelectedId(selectedFarmerId);
        } else if (farmers.length > 0 && !selectedId) {
          setSelectedId(farmers[0].id);
        }
      }, [selectedFarmerId, farmers]);

      const currentFarmer = farmers.find(f => String(f.id) === String(selectedId)) || farmers[0];

      const handleFarmerChange = (e) => {
        const id = e.target.value;
        setSelectedId(id);
        onSelectFarmer(id);
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!currentFarmer) return;

        onConfirmTurn({
          farmer_id: currentFarmer.id,
          status: status,
          actual_received_hours: status === 'PARTIAL' ? parseFloat(partialHours) : null,
          notes: notes
        });
      };

      if (!farmers || farmers.length === 0) return null;

      return (
        <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
          <div className="flex items-center justify-between mb-4 pb-3 border-b border-slate-100">
            <div>
              <h3 className="text-lg font-bold text-slate-900">Farmer Simulation Panel</h3>
              <p className="text-xs text-slate-500">
                Simulate a farmer confirming delivery or reporting canal diversion
              </p>
            </div>
            <span className="bg-emerald-50 text-emerald-700 text-xs px-2.5 py-1 rounded-full font-semibold border border-emerald-200">
              Interactive Node
            </span>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-12 gap-6">
            <div className="md:col-span-6 space-y-4">
              <div>
                <label className="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1.5">
                  Select Farmer
                </label>
                <select
                  value={selectedId}
                  onChange={handleFarmerChange}
                  className="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium text-slate-800 focus:outline-none focus:ring-2 focus:ring-sky-500"
                >
                  {farmers.map(f => (
                    <option key={f.id} value={f.id}>
                      {f.name} ({f.canal_reach} Reach) — Deficit: {f.accumulated_deficit_hours}h
                    </option>
                  ))}
                </select>
              </div>

              {currentFarmer && (
                <div className="bg-slate-50 rounded-xl p-4 border border-slate-200/80">
                  <div className="flex items-center justify-between mb-2">
                    <span className="font-bold text-slate-900 text-base">{currentFarmer.name}</span>
                    <span className={`text-[11px] font-semibold px-2 py-0.5 rounded-full border ${
                      currentFarmer.canal_reach === 'Tail' 
                        ? 'bg-purple-50 text-purple-700 border-purple-200' 
                        : currentFarmer.canal_reach === 'Middle'
                        ? 'bg-amber-50 text-amber-700 border-amber-200'
                        : 'bg-emerald-50 text-emerald-700 border-emerald-200'
                    }`}>
                      {currentFarmer.canal_reach} Reach Canal
                    </span>
                  </div>

                  <div className="grid grid-cols-2 gap-2 text-xs text-slate-600 mt-3">
                    <div className="bg-white p-2 rounded-lg border border-slate-100">
                      <span className="text-slate-400 block text-[10px]">Crop & Land:</span>
                      <span className="font-semibold text-slate-800">{currentFarmer.crop_type} ({currentFarmer.plot_acres} ac)</span>
                    </div>
                    <div className="bg-white p-2 rounded-lg border border-slate-100">
                      <span className="text-slate-400 block text-[10px]">Village Section:</span>
                      <span className="font-semibold text-slate-800">{currentFarmer.village}</span>
                    </div>
                    <div className="bg-white p-2 rounded-lg border border-slate-100">
                      <span className="text-slate-400 block text-[10px]">Accumulated Deficit:</span>
                      <span className={`font-bold ${currentFarmer.accumulated_deficit_hours > 5 ? 'text-rose-600' : 'text-slate-800'}`}>
                        {currentFarmer.accumulated_deficit_hours} Hours
                      </span>
                    </div>
                    <div className="bg-white p-2 rounded-lg border border-slate-100">
                      <span className="text-slate-400 block text-[10px]">Watered History:</span>
                      <span className="font-semibold text-sky-700">{currentFarmer.total_received_hours} hrs received</span>
                    </div>
                  </div>
                </div>
              )}
            </div>

            <div className="md:col-span-6 bg-slate-50/70 p-4 rounded-xl border border-slate-200 flex flex-col justify-between">
              <div>
                <label className="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">
                  Report Delivery Outcome
                </label>

                <div className="space-y-2 mb-3">
                  <label 
                    className={`flex items-center gap-3 p-2.5 rounded-xl border cursor-pointer transition-all ${
                      status === 'FULL' 
                        ? 'bg-emerald-50 border-emerald-300 text-emerald-900 font-semibold' 
                        : 'bg-white border-slate-200 text-slate-700 hover:bg-slate-50'
                    }`}
                  >
                    <input
                      type="radio"
                      name="status"
                      value="FULL"
                      checked={status === 'FULL'}
                      onChange={() => setStatus('FULL')}
                      className="accent-emerald-600"
                    />
                    <div className="text-xs">
                      <span className="block font-bold">✅ Confirm Water Received (Full Turn)</span>
                      <span className="text-[11px] text-emerald-700 font-normal">
                        Water arrived as scheduled. Deficit clears.
                      </span>
                    </div>
                  </label>

                  <label 
                    className={`flex items-center gap-3 p-2.5 rounded-xl border cursor-pointer transition-all ${
                      status === 'PARTIAL' 
                        ? 'bg-amber-50 border-amber-300 text-amber-900 font-semibold' 
                        : 'bg-white border-slate-200 text-slate-700 hover:bg-slate-50'
                    }`}
                  >
                    <input
                      type="radio"
                      name="status"
                      value="PARTIAL"
                      checked={status === 'PARTIAL'}
                      onChange={() => setStatus('PARTIAL')}
                      className="accent-amber-600"
                    />
                    <div className="text-xs">
                      <span className="block font-bold">⚠️ Report Partial Water Received</span>
                      <span className="text-[11px] text-amber-700 font-normal">
                        Pressure fell or diverted early. Remaining credited.
                      </span>
                    </div>
                  </label>

                  <label 
                    className={`flex items-center gap-3 p-2.5 rounded-xl border cursor-pointer transition-all ${
                      status === 'MISSED' 
                        ? 'bg-rose-50 border-rose-300 text-rose-900 font-semibold' 
                        : 'bg-white border-slate-200 text-slate-700 hover:bg-slate-50'
                    }`}
                  >
                    <input
                      type="radio"
                      name="status"
                      value="MISSED"
                      checked={status === 'MISSED'}
                      onChange={() => setStatus('MISSED')}
                      className="accent-rose-600"
                    />
                    <div className="text-xs">
                      <span className="block font-bold">❌ Report Water Missed (Canal Diverted/Dry)</span>
                      <span className="text-[11px] text-rose-700 font-normal">
                        Turn missed. Deficit increases & priority boosted next round.
                      </span>
                    </div>
                  </label>
                </div>

                {status === 'PARTIAL' && (
                  <div className="mb-3 p-2.5 bg-amber-50/70 rounded-lg border border-amber-200">
                    <label className="block text-[11px] font-bold text-amber-900 mb-1">
                      Actual Hours of Flow Received:
                    </label>
                    <input
                      type="number"
                      step="0.5"
                      min="0.5"
                      max="10"
                      value={partialHours}
                      onChange={(e) => setPartialHours(e.target.value)}
                      className="w-full px-3 py-1.5 bg-white border border-amber-300 rounded-lg text-xs font-semibold text-amber-900"
                    />
                  </div>
                )}

                <div className="mb-3">
                  <input
                    type="text"
                    placeholder="Optional incident note (e.g., upstream headgate diverted)"
                    value={notes}
                    onChange={(e) => setNotes(e.target.value)}
                    className="w-full px-3 py-2 bg-white border border-slate-200 rounded-lg text-xs text-slate-700 placeholder-slate-400 focus:outline-none focus:ring-1 focus:ring-sky-500"
                  />
                </div>
              </div>

              <button
                onClick={handleSubmit}
                disabled={isSubmitting}
                className="w-full py-2.5 px-4 bg-sky-600 hover:bg-sky-700 text-white rounded-xl text-xs font-bold transition-all shadow-sm active:scale-95 disabled:opacity-50"
              >
                {isSubmitting ? 'Recording on Ledger...' : 'Submit Confirmation & Update Deficit'}
              </button>
            </div>
          </div>
        </div>
      );
    }

    function TransparentLedger({ logs, integrityInfo, onRefresh }) {
      const [searchTerm, setSearchTerm] = useState('');

      const filteredLogs = (logs || []).filter(log => {
        if (!searchTerm) return true;
        const term = searchTerm.toLowerCase();
        return (
          log.farmer_name.toLowerCase().includes(term) ||
          log.status.toLowerCase().includes(term) ||
          (log.notes && log.notes.toLowerCase().includes(term)) ||
          log.current_hash.toLowerCase().includes(term)
        );
      });

      return (
        <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
          <div className="p-5 border-b border-slate-100 bg-slate-900 text-white flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
            <div>
              <div className="flex items-center gap-2">
                <span className="text-xl">🛡️</span>
                <h3 className="text-lg font-bold">Transparent Distribution Ledger</h3>
                <span className="bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 text-xs px-2.5 py-0.5 rounded-full font-mono font-medium">
                  SHA-256 Chain Verified
                </span>
              </div>
              <p className="text-xs text-slate-400 mt-1">
                Every water turn confirmation is cryptographically chained. Any alteration immediately breaks the root hash.
              </p>
            </div>

            <div className="flex items-center gap-3">
              <div className="text-right">
                <div className="text-[11px] text-slate-400 uppercase tracking-wider">Validated Blocks</div>
                <div className="text-base font-bold font-mono text-emerald-400">
                  {integrityInfo?.count ?? (logs?.length || 0)} Blocks Intact
                </div>
              </div>
              <button
                onClick={onRefresh}
                className="p-2 bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-300 rounded-lg text-xs font-medium transition-all"
                title="Re-verify cryptographic ledger"
              >
                ↻ Verify
              </button>
            </div>
          </div>

          <div className="p-4 bg-slate-50 border-b border-slate-100 flex items-center justify-between gap-4">
            <div className="relative w-full max-w-sm">
              <input
                type="text"
                placeholder="Search farmer, status, or notes..."
                value={searchTerm}
                onChange={(e) => setSearchTerm(e.target.value)}
                className="w-full pl-9 pr-4 py-2 bg-white border border-slate-200 rounded-xl text-xs text-slate-700 focus:outline-none focus:ring-2 focus:ring-sky-500"
              />
              <span className="absolute left-3 top-2.5 text-slate-400 text-xs">🔍</span>
            </div>
            <div className="text-xs text-slate-500 font-medium">
              Showing {filteredLogs.length} ledger records
            </div>
          </div>

          <div className="overflow-x-auto">
            <table className="w-full text-left border-collapse font-sans text-xs">
              <thead>
                <tr className="bg-slate-50 border-b border-slate-200 text-slate-500 uppercase tracking-wider font-semibold text-[11px]">
                  <th className="py-3 px-4">Block #</th>
                  <th className="py-3 px-4">Timestamp</th>
                  <th className="py-3 px-4">Farmer</th>
                  <th className="py-3 px-4">Scheduled / Received</th>
                  <th className="py-3 px-4">Status</th>
                  <th className="py-3 px-4">Verification Audit Notes</th>
                  <th className="py-3 px-4 font-mono">SHA-256 Cryptographic Hash</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-100 text-slate-700">
                {filteredLogs.map((log) => {
                  const isFull = log.status === 'FULL';
                  const isPartial = log.status === 'PARTIAL';

                  return (
                    <tr key={log.id} className="hover:bg-slate-50/70 transition-colors">
                      <td className="py-3 px-4 font-mono font-bold text-slate-900">
                        #{log.id}
                      </td>
                      <td className="py-3 px-4 text-slate-500 whitespace-nowrap">
                        {log.timestamp}
                      </td>
                      <td className="py-3 px-4 font-semibold text-slate-900">
                        {log.farmer_name}
                      </td>
                      <td className="py-3 px-4">
                        <span className="font-bold text-slate-800">{log.actual_received_hours}h</span>
                        <span className="text-slate-400 text-[11px]"> / {log.scheduled_hours}h</span>
                      </td>
                      <td className="py-3 px-4">
                        <span className={`inline-block px-2.5 py-0.5 rounded-full text-[10px] font-bold border ${
                          isFull
                            ? 'bg-emerald-50 text-emerald-700 border-emerald-200'
                            : isPartial
                            ? 'bg-amber-50 text-amber-700 border-amber-200'
                            : 'bg-rose-50 text-rose-700 border-rose-200'
                        }`}>
                          {log.status}
                        </span>
                      </td>
                      <td className="py-3 px-4 text-slate-600 max-w-xs truncate" title={log.notes}>
                        {log.notes || '—'}
                      </td>
                      <td className="py-3 px-4 font-mono text-[11px] text-slate-500 whitespace-nowrap">
                        <div className="flex items-center gap-1.5">
                          <span className="text-emerald-600" title="Hash unbroken">✓</span>
                          <span className="bg-slate-100 px-2 py-0.5 rounded text-slate-700">
                            {log.current_hash ? `${log.current_hash.substring(0, 10)}...${log.current_hash.substring(56)}` : 'GENESIS'}
                          </span>
                        </div>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    function App() {
      const [stats, setStats] = useState(null);
      const [farmers, setFarmers] = useState([]);
      const [schedule, setSchedule] = useState([]);
      const [logs, setLogs] = useState([]);
      const [integrityInfo, setIntegrityInfo] = useState(null);
      const [selectedFarmerId, setSelectedFarmerId] = useState(null);
      const [isRunning, setIsRunning] = useState(false);
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [notification, setNotification] = useState(null);

      const fetchAllData = async () => {
        try {
          const [statsRes, farmersRes, scheduleRes, logsRes] = await Promise.all([
            fetch('/stats'),
            fetch('/farmers'),
            fetch('/schedule'),
            fetch('/logs')
          ]);

          const statsData = await statsRes.json();
          const farmersData = await farmersRes.json();
          const scheduleData = await scheduleRes.json();
          const logsData = await logsRes.json();

          setStats(statsData);
          setFarmers(farmersData.data || []);
          setSchedule(scheduleData.data || []);
          setLogs(logsData.data || []);
          setIntegrityInfo(logsData.cryptographic_integrity);
        } catch (err) {
          console.error('Failed to fetch data:', err);
        }
      };

      useEffect(() => {
        fetchAllData();
      }, []);

      const showNotification = (msg, type = 'success') => {
        setNotification({ msg, type });
        setTimeout(() => setNotification(null), 6000);
      };

      const handleRunAlgorithm = async () => {
        setIsRunning(true);
        try {
          const res = await fetch('/schedule/generate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ available_canal_hours: 24.0 })
          });
          const data = await res.json();
          if (res.ok) {
            showNotification(
              `✨ KulhWise Algorithm executed! Fairness increased from ${data.before_fairness_score}% → ${data.after_fairness_score}% (+${data.improvement_percentage}%). Deprived tail farmers prioritized!`,
              'success'
            );
            await fetchAllData();
          } else {
            showNotification(data.detail || 'Failed to generate schedule', 'error');
          }
        } catch (err) {
          showNotification('Error communicating with backend', 'error');
        } finally {
          setIsRunning(false);
        }
      };

      const handleReset = async () => {
        try {
          const res = await fetch('/reset', { method: 'POST' });
          const data = await res.json();
          showNotification('↺ System reset to initial unfair baseline. Ready to demonstrate!', 'info');
          await fetchAllData();
        } catch (err) {
          showNotification('Failed to reset database', 'error');
        }
      };

      const handleConfirmTurn = async (payload) => {
        setIsSubmitting(true);
        try {
          const res = await fetch('/turn/confirm', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const data = await res.json();
          if (res.ok) {
            showNotification(
              `📝 ${data.message} Verified block #${data.log_entry.id} added to SHA-256 chain.`,
              'success'
            );
            await fetchAllData();
          } else {
            showNotification(data.detail || 'Failed to confirm turn', 'error');
          }
        } catch (err) {
          showNotification('Error recording turn', 'error');
        } finally {
          setIsSubmitting(false);
        }
      };

      return (
        <div className="min-h-screen bg-slate-50 text-slate-900 pb-16">
          <header className="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-xs">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 bg-emerald-600 rounded-xl flex items-center justify-center text-white text-xl shadow-sm">
                  💧
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <h1 className="text-xl font-bold tracking-tight text-slate-900">KulhWise</h1>
                    <span className="bg-emerald-100 text-emerald-800 text-[10px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wider">
                      Hackathon Prototype
                    </span>
                  </div>
                  <p className="text-xs text-slate-500">Smart Water Rotation for Shared Rural Canals</p>
                </div>
              </div>

              <div className="flex items-center gap-4 text-xs">
                <div className="hidden sm:flex items-center gap-2 bg-slate-100 px-3 py-1.5 rounded-lg border border-slate-200 text-slate-600">
                  <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                  <span>Canal Flow Status: <strong>Optimal</strong></span>
                </div>
              </div>
            </div>
          </header>

          <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-8 space-y-8">
            {notification && (
              <div className={`p-4 rounded-xl text-sm font-medium flex items-center justify-between shadow-sm transition-all ${
                notification.type === 'error'
                  ? 'bg-rose-50 text-rose-800 border border-rose-200'
                  : notification.type === 'info'
                  ? 'bg-sky-50 text-sky-800 border border-sky-200'
                  : 'bg-emerald-50 text-emerald-800 border border-emerald-200'
              }`}>
                <div className="flex items-center gap-2">
                  <span>{notification.type === 'error' ? '⚠️' : '✅'}</span>
                  <span>{notification.msg}</span>
                </div>
                <button
                  onClick={() => setNotification(null)}
                  className="text-xs opacity-60 hover:opacity-100 font-bold ml-4"
                >
                  ✕
                </button>
              </div>
            )}

            <OverviewPanel
              stats={stats}
              onRunAlgorithm={handleRunAlgorithm}
              onReset={handleReset}
              isRunning={isRunning}
            />

            <ScheduleTimeline
              schedule={schedule}
              onQuickConfirm={(farmerId) => {
                setSelectedFarmerId(farmerId);
                window.scrollTo({ top: document.body.scrollHeight / 2, behavior: 'smooth' });
              }}
            />

            <FarmerSimulation
              farmers={farmers}
              selectedFarmerId={selectedFarmerId}
              onSelectFarmer={(id) => setSelectedFarmerId(id)}
              onConfirmTurn={handleConfirmTurn}
              isSubmitting={isSubmitting}
            />

            <TransparentLedger
              logs={logs}
              integrityInfo={integrityInfo}
              onRefresh={fetchAllData}
            />
          </main>

          <footer className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-16 pt-8 border-t border-slate-200 text-center text-xs text-slate-400">
            <p>KulhWise – Built for 24-Hour Hackathon • Python (FastAPI) + SQLite + React + Tailwind CSS</p>
            <p className="mt-1">Empowering Himalayan "Kulh" and rural canal communities with algorithmic fairness and tamper-proof records.</p>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
